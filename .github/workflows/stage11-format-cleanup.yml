name: Stage 11 Format Cleanup

on:
  push:
    branches:
      - mvp/environment-controller
    paths:
      - ".github/workflows/stage11-format-cleanup.yml"

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-dev.txt

      - name: Install tooling
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -r requirements-dev.txt

      - name: Apply pre-commit autofixes
        run: pre-commit run --all-files || true

      - name: Require clean quality gate after autofix
        run: pre-commit run --all-files

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "Format distributed climate tooling"
          git push origin HEAD:mvp/environment-controller
