name: ML Distributed DAgger Stage 11

on:
  workflow_dispatch:
  push:
    branches:
      - mvp/environment-controller
    paths:
      - ".github/workflows/ml-dagger-distributed.yml"
      - "tools/ml/run_dagger_distributed.py"
      - "tests/test_climate_dagger_distributed.py"

permissions:
  contents: write

concurrency:
  group: ml-stage11-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: "."
  PYTHONHASHSEED: "0"
  TF_DETERMINISTIC_OPS: "1"
  TF_CPP_MIN_LOG_LEVEL: "2"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  base-dataset:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Regenerate frozen Stage 9B base dataset
        run: |
          python tools/ml/run_dagger_distributed.py base \
            --output build/stage11/base.npz \
            --workers 4

      - name: Upload base dataset
        uses: actions/upload-artifact@v4
        with:
          name: stage11-base
          path: build/stage11/base.npz
          if-no-files-found: error
          retention-days: 7

  dagger-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Collect DAgger shard
        run: |
          python tools/ml/run_dagger_distributed.py collect \
            --weights reports/ml/climate_v6_model_dagger_candidate.npz \
            --metadata reports/ml/climate_v6_model_dagger_candidate.json \
            --output build/stage11/shard-${{ matrix.shard }}.npz \
            --seed 720003 \
            --scenarios-per-family 12 \
            --steps-per-scenario 100 \
            --workers 4 \
            --shard-index ${{ matrix.shard }} \
            --shard-count 6

      - name: Upload DAgger shard
        uses: actions/upload-artifact@v4
        with:
          name: stage11-shard-${{ matrix.shard }}
          path: build/stage11/shard-${{ matrix.shard }}.npz
          if-no-files-found: error
          retention-days: 7

  merge-dataset:
    needs: [base-dataset, dagger-shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Download base dataset
        uses: actions/download-artifact@v4
        with:
          name: stage11-base
          path: build/stage11/base

      - name: Download DAgger shards
        uses: actions/download-artifact@v4
        with:
          pattern: stage11-shard-*
          path: build/stage11/shards
          merge-multiple: true

      - name: Merge train-only DAgger shards
        run: |
          python tools/ml/run_dagger_distributed.py merge \
            --base build/stage11/base/base.npz \
            --shards build/stage11/shards/shard-*.npz \
            --output build/stage11/dataset.npz \
            --summary build/stage11/merge-summary.json \
            --scenarios-per-family 12 \
            --steps-per-scenario 100

      - name: Upload merged dataset
        uses: actions/upload-artifact@v4
        with:
          name: stage11-dataset
          path: |
            build/stage11/dataset.npz
            build/stage11/merge-summary.json
          if-no-files-found: error
          retention-days: 7

  train-candidate:
    needs: merge-dataset
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        hidden: [32, 64, 96]
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Download merged dataset
        uses: actions/download-artifact@v4
        with:
          name: stage11-dataset
          path: build/stage11

      - name: Train and dev-benchmark candidate
        run: |
          python tools/ml/run_dagger_distributed.py train \
            --dataset build/stage11/dataset.npz \
            --hidden-units ${{ matrix.hidden }} \
            --epochs 36 \
            --workers 4 \
            --output-dir build/stage11/candidate-${{ matrix.hidden }}

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: stage11-candidate-${{ matrix.hidden }}
          path: build/stage11/candidate-${{ matrix.hidden }}/*
          if-no-files-found: error
          retention-days: 7

  final-held-out:
    needs: train-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Download merged dataset
        uses: actions/download-artifact@v4
        with:
          name: stage11-dataset
          path: build/stage11

      - name: Download candidates
        uses: actions/download-artifact@v4
        with:
          pattern: stage11-candidate-*
          path: build/stage11/candidates
          merge-multiple: true

      - name: Select on dev and run new held-out once
        run: |
          python tools/ml/run_dagger_distributed.py final \
            --dataset build/stage11/dataset.npz \
            --candidate-reports build/stage11/candidates/candidate-h*-report.json \
            --candidate-root build/stage11/candidates \
            --workers 4 \
            --output-report reports/ml/climate_v6_stage11_distributed.json \
            --output-weights reports/ml/climate_v6_model_stage11_candidate.npz \
            --output-metadata reports/ml/climate_v6_model_stage11_candidate.json

      - name: Upload final Stage 11 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage11-final
          path: |
            reports/ml/climate_v6_stage11_distributed.json
            reports/ml/climate_v6_model_stage11_candidate.npz
            reports/ml/climate_v6_model_stage11_candidate.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit final Stage 11 report
        if: github.ref == 'refs/heads/mvp/environment-controller'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            reports/ml/climate_v6_stage11_distributed.json \
            reports/ml/climate_v6_model_stage11_candidate.npz \
            reports/ml/climate_v6_model_stage11_candidate.json
          if git diff --cached --quiet; then
            echo "No Stage 11 artifact changes to commit"
            exit 0
          fi
          git commit -m "Run distributed climate DAgger architecture search"
          git push origin HEAD:mvp/environment-controller
