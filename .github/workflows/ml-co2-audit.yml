name: Climate CO2 Exhaust Audit

on:
  push:
    branches:
      - mvp/environment-controller
    paths:
      - ".github/workflows/ml-co2-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  co2-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Run fresh CO2/exhaust diagnostic
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: 0
          TF_DETERMINISTIC_OPS: 1
          TF_CPP_MIN_LOG_LEVEL: 2
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
        run: |
          python -m tools.ml.climate_co2_audit \
            --stage10-weights reports/ml/climate_v6_model_dagger_candidate.npz \
            --stage10-metadata reports/ml/climate_v6_model_dagger_candidate.json \
            --stage11-weights reports/ml/climate_v6_model_stage11_candidate.npz \
            --stage11-metadata reports/ml/climate_v6_model_stage11_candidate.json \
            --seed 424242 \
            --scenarios-per-family 4 \
            --steps 60 \
            --workers 4 \
            --output reports/ml/climate_co2_exhaust_audit_seed424242.json

      - name: Upload diagnostic report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: climate-co2-exhaust-audit
          path: reports/ml/climate_co2_exhaust_audit_seed424242.json
          if-no-files-found: error
          retention-days: 30
